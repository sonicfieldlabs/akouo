name: Release validation

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Verify reviewed Earworm wheel
        run: shasum -a 256 -c vendor/SHA256SUMS

      - name: Install Python contract and validator
        run: python3 -m pip install .

      - name: Validate portable release
        env:
          AKOUO_AKOUSMA_WHEEL: vendor/akousma-0.10.1-py3-none-any.whl
          AKOUO_AKOUSMA_SHA256: f3aa570f572f6e95c9ef31be3bda4bd3412998ccc58dbda688aa20057bf053e3
        run: ./scripts/validate-release.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck app
        working-directory: app
        run: npm run typecheck

      - name: Build app
        working-directory: app
        run: npm run build
