# Portable PR checks run once; full platform qualification is deliberate.
name: Release validation

on:
  pull_request:
    branches:
    - main
    - release/**
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Verify reviewed Earworm wheel
        run: shasum -a 256 -c vendor/SHA256SUMS

      - name: Install Python contract and validator
        run: python3 -m pip install .

      - name: Validate portable release
        env:
          AKOUO_AKOUSMA_WHEEL: vendor/akousma-0.10.1-py3-none-any.whl
          AKOUO_AKOUSMA_SHA256: f3aa570f572f6e95c9ef31be3bda4bd3412998ccc58dbda688aa20057bf053e3
        run: ./scripts/validate-release.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck app
        working-directory: app
        run: npm run typecheck

      - name: Check router parity with the Python contract
        run: node scripts/router-parity.mjs --check

      - name: Build app
        working-directory: app
        run: npm run build
